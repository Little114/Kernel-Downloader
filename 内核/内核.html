<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>内核推荐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #f0f4ff 0%, #e8ecf5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 70px;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .back-btn-top {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 12px;
        }

        .back-btn-top .icon {
            font-size: 22px;
            font-weight: bold;
        }

        .header {
            text-align: center;
            padding: 50px 20px 30px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .header p {
            font-size: 15px;
            color: #666;
            margin-bottom: 10px;
        }



        .options-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 60px;
            gap: 24px;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .option-btn {
            background: white;
            border: none;
            border-radius: 24px;
            padding: 32px 24px;
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .option-btn:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.15);
        }

        .option-btn:active {
            transform: translateY(-3px) scale(0.98);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn-top" onclick="goBack()">
            <span class="icon">←</span>
            <span>返回</span>
        </button>
    </div>

    <div class="header">
        <h1>内核推荐列表</h1>
        <p>官方飞机频道 @chenmoyes</p>
        <p>q群：126915076</p>
        <p>更新时间2026/6/2</p>
    </div>

    <div class="options-container">
        <button class="option-btn" onclick="goToShaoJi()">
            小烧鸡
        </button>
        
    </div>

    <script>
        function goToShaoJi() {
            window.location.href = './内核/烧鸡/小烧鸡.html';
        }

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
