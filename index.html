<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>内核下载器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #f0f4ff 0%, #e8ecf5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 60px 20px 40px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 20px;
        }

        .header p {
            font-size: 15px;
            color: #666;
            margin-bottom: 10px;
        }



        .options-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 60px;
            gap: 24px;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .option-btn {
            background: white;
            border: 2px solid transparent;
            border-radius: 24px;
            padding: 32px 24px;
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .option-btn span {
            position: relative;
            z-index: 1;
        }

        .option-btn:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 16px 50px rgba(102, 126, 234, 0.25);
            border-color: #667eea;
        }

        .option-btn:hover::before {
            opacity: 0.08;
        }

        .option-btn:active {
            transform: translateY(-3px) scale(0.98);
        }

        .option-btn.active::before {
            opacity: 1;
        }

        .option-btn.active span {
            color: white;
        }

        .icon {
            font-size: 28px;
        }


    </style>
</head>
<body>
    <div class="header">
        <h1>内核下载器</h1>
        <h2>官方推荐列表</h2>
        <p>官方飞机频道 @chenmoyes</p>
        <p>q群：126915076</p>
    </div>

    <div class="options-container">
        <button class="option-btn option-1" onclick="goToKernel()">
            <span>内核</span>
        </button>
        <button class="option-btn option-2" onclick="goToData()">
            <span>数据号</span>
        </button>
    </div>

    <script>
        function goToKernel() {
            window.location.href = '内核/内核.html';
        }

        function goToData() {
            window.location.href = '数据号/数据号.html';
        }
    </script>
</body>
</html>
