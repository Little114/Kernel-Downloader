<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>内核下载器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #f0f4ff 0%, #e8ecf5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .header {
            text-align: center;
            padding: 40px 15px 25px;
            margin-bottom: 5px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .header h2 {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 15px;
        }

        .header p {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .options-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 40px;
            gap: 16px;
            max-width: 340px;
            width: 100%;
            margin: 0 auto;
        }

        .option-btn {
            background: white;
            border: none;
            border-radius: 14px;
            padding: 14px 12px;
            font-size: 15px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }

        .option-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>内核下载器</h1>
        <h2>官方推荐列表</h2>
        <p>官方飞机频道 @chenmoyes</p>
        <p>q群：126915076</p>
    </div>

    <div class="options-container">
        <button class="option-btn" onclick="goToKernel()">
            内核
        </button>
        <button class="option-btn" onclick="goToData()">
            数据号
        </button>
    </div>

    <script>
        function goToKernel() {
            window.location.href = '内核/内核.html';
        }

        function goToData() {
            window.location.href = '数据号/数据号.html';
        }
    </script>
</body>
</html>
