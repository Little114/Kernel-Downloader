<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数据号推荐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #f0f4ff 0%, #e8ecf5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 50px;
        }

        .empty-message {
            text-align: center;
            color: #1a1a2e;
            font-size: 22px;
            font-weight: 700;
            padding: 30px 20px;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.06);
        }

        .back-btn-top {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: #1a1a2e;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
        }

        .back-btn-top .icon {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn-top" onclick="goBack()">
            <span class="icon">←</span>
            <span>返回</span>
        </button>
    </div>

    <h1 class="empty-message">当前没有数据号可以推荐</h1>

    <script>
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
