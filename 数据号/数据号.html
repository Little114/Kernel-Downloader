<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数据号推荐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #f0f4ff 0%, #e8ecf5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 60px;
        }

        .empty-message {
            text-align: center;
            color: #1a1a2e;
            font-size: 28px;
            font-weight: 700;
            padding: 50px 30px;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .back-btn-top {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 12px;
        }

        .back-btn-top .icon {
            font-size: 22px;
            font-weight: bold;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }

        .options-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 60px;
            gap: 24px;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 20px;
            padding: 30px 24px;
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 0%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .option-btn span {
            position: relative;
            z-index: 1;
        }

        .option-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            border-color: #667eea;
        }

        .option-btn:active {
            transform: translateY(-2px);
        }

        .option-btn.active::before {
            opacity: 1;
        }

        .option-btn.active span {
            color: white;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn-top" onclick="goBack()">
            <span class="icon">←</span>
            <span>返回</span>
        </button>
    </div>

    <h1 class="empty-message">当前没有数据号可以推荐</h1>

    <script>


        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
